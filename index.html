<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS TASARIMI TAMAMEN AYNI - MASALSI TEMA */
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 850px; background-color: #fffaf0; padding: 40px 50px; border-radius: 40px; border: 12px solid #ffb347; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), inset 0 0 20px rgba(255,255,255,0.8); text-align: center; position: relative; }
        h1 { color: #ff6b6b; margin-bottom: 5px; font-size: 2.8em; font-weight: 900; text-shadow: 3px 3px 0px #ffe6e6; letter-spacing: 1px; }
        h2 { color: #4ecdc4; font-weight: 700; font-size: 1.3em; margin-bottom: 30px; }
        #file-upload-area { border: 4px dashed #ffd166; border-radius: 25px; padding: 40px 20px; cursor: pointer; background-color: #fffff9; transition: all 0.3s ease; }
        #file-upload-area:hover { background-color: #fff3cc; border-color: #ffb347; transform: scale(1.02); }
        #file-upload-area .upload-icon { font-size: 60px; color: #ffd166; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(255, 209, 102, 0.5); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        #file-upload-area p { font-size: 1.1em; color: #7f8c8d; font-weight: 700; }
        #file-input { display: none; }
        .progress-container { width: 100%; background-color: #ecf0f1; border-radius: 20px; margin-top: 25px; height: 25px; display: none; box-shadow: inset 0 3px 6px rgba(0,0,0,0.1); }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #a8ff78 0%, #78ffd6 100%); border-radius: 20px; transition: width 0.5s ease-in-out; box-shadow: 0 3px 10px rgba(120, 255, 214, 0.5); }
        .font-controls { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 25px; margin-bottom: -15px; }
        .font-controls button { background-color: #ff9f1c; color: white; width: 45px; height: 45px; padding: 0; font-size: 22px; font-weight: 900; line-height: 45px; margin-top: 0; border-radius: 50%; box-shadow: 0 5px 0 #cc7a00; transition: all 0.1s; }
        .font-controls button:hover { background-color: #ffb347; transform: translateY(2px); box-shadow: 0 3px 0 #cc7a00; }
        .font-controls button:active { transform: translateY(5px); box-shadow: 0 0 0 #cc7a00; }
        #okuma-alani { font-size: 26px; line-height: 2; margin-top: 25px; border: 4px solid #bde0fe; background-color: white; border-radius: 25px; padding: 25px; text-align: left; color: #2c3e50; font-weight: 700; transition: font-size 0.3s; position: relative; box-shadow: inset 0 5px 15px rgba(0,0,0,0.03); }
        #okuma-alani span { padding: 4px 8px; border-radius: 8px; transition: all 0.3s; cursor: pointer; display: inline-block; }
        #okuma-alani span:hover { background-color: #f1f2f6; transform: scale(1.05); }
        .correct { background-color: #c8e6c9 !important; color: #2e7d32 !important; box-shadow: 0 2px 5px rgba(46, 125, 50, 0.2); }
        .incorrect { background-color: #ffcdd2 !important; color: #c62828 !important; text-decoration: none; border-bottom: 4px solid #e53935; box-shadow: 0 2px 5px rgba(198, 40, 40, 0.2); }
        
        /* Butonun etrafındaki boşlukları biraz ayarlıyoruz çünkü yerini değiştirdik */
        #baslatBtn { padding: 18px 40px; font-size: 22px; font-weight: 800; font-family: 'Nunito', sans-serif; cursor: pointer; border: none; border-radius: 35px; background: linear-gradient(to bottom, #4ecdc4, #2b938a); color: white; transition: all 0.2s; margin-top: 25px; margin-bottom: 10px; box-shadow: 0 8px 0 #1f6b64, 0 15px 20px rgba(0,0,0,0.2); text-transform: uppercase; letter-spacing: 1px; }
        #baslatBtn i { margin-right: 12px; font-size: 24px; }
        #baslatBtn:hover:not(:disabled) { background: linear-gradient(to bottom, #5ce1d8, #32a89d); transform: translateY(3px); box-shadow: 0 5px 0 #1f6b64, 0 10px 15px rgba(0,0,0,0.2); }
        #baslatBtn:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 0 0 #1f6b64; }
        #baslatBtn:disabled { background: #bdc3c7; box-shadow: 0 8px 0 #95a5a6; cursor: not-allowed; }
        
        #durum { margin-top: 20px; font-size: 1.2em; font-weight: 700; color: #ff6b6b; height: 30px; display: flex; justify-content: center; align-items: center; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #ff9f1c; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.visible { display: flex; }
        .modal-content { background: #fffaf0; padding: 40px; border-radius: 30px; border: 8px solid #4ecdc4; width: 90%; max-width: 550px; text-align: center; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-close-btn { position: absolute; top: 15px; right: 20px; font-size: 35px; color: #ff6b6b; cursor: pointer; border: none; background: none; font-weight: 900; transition: transform 0.2s; }
        .modal-close-btn:hover { transform: scale(1.2); }
        .modal-content h2 { font-size: 2.2em; color: #ff9f1c; margin-top: 0; }
        .modal-content h3 { color: #2c3e50; font-size: 1.5em; }
        .modal-content p { font-size: 1.2em; font-weight: 700; color: #7f8c8d; }
        #incorrectWordsList { margin-top: 20px; padding: 15px; background-color: #ffcdd2; border: 3px dashed #e53935; border-radius: 15px; color: #c62828; font-weight: 800; font-size: 1.2em; max-height: 120px; overflow-y: auto; }
        #retryIncorrectBtn { background: linear-gradient(to bottom, #ff9f1c, #e67e22); box-shadow: 0 6px 0 #cc7a00; font-size: 18px; padding: 15px 30px; border-radius: 25px; margin-top: 25px; color: white; border: none; cursor: pointer; font-weight: 700; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
        #retryIncorrectBtn:hover { background: linear-gradient(to bottom, #ffb347, #f39c12); transform: translateY(2px); box-shadow: 0 4px 0 #cc7a00; }
        #correction-box { position: fixed; background-color: #2c3e50; color: white; padding: 12px; border-radius: 15px; border: 3px solid #ffb347; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: none; gap: 12px; align-items: center; z-index: 10; animation: bounceIn 0.3s; }
        @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #correction-box button { margin: 0; padding: 10px 20px; font-size: 16px; border-radius: 15px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); border: none; color: white; font-weight: bold; cursor: pointer; }
        #correction-box button:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        #retry-word-btn { background-color: #4ecdc4; }
        #skip-word-btn { background-color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Okuma Arkadaşım </h1>
        <h2>Okunacak Word Dosyasını Seçerek Maceraya Başla!</h2>
        
        <div id="file-upload-area">
            <div class="upload-icon"><i class="fas fa-magic"></i></div>
            <p>Dosyayı buraya sürükleyin veya seçmek için tıklayın</p>
            <input type="file" id="file-input" accept=".docx">
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="font-controls">
            <button id="fontDecreaseBtn" title="Yazı Tipi Küçült">-</button>
            <button id="fontIncreaseBtn" title="Yazı Tipi Büyüt">+</button>
            <button id="fontResetBtn" title="Sıfırla">A</button>
        </div>
        
        <div><button id="baslatBtn" disabled><i class="fas fa-microphone"></i>Okumaya Başla</button></div>

        <div id="okuma-alani"></div>
        
        <div id="correction-box">
            <button id="retry-word-btn"><i class="fas fa-redo"></i> Tekrar Oku</button>
            <button id="skip-word-btn">Atla <i class="fas fa-forward"></i></button>
        </div>
        
        <div id="durum"></div>
    </div>

    <div class="modal-overlay" id="sonucModal">
        <div class="modal-content">
            <button class="modal-close-btn" id="modalKapatBtn">&times;</button>
            <h2>Harika İş Çıkardın!</h2>
            <h3>İşte Okuma Raporun:</h3>
            <p>Toplam Kelime: <strong id="totalWords">0</strong></p>
            <p>Doğru Okunan: <strong id="correctWords" style="color: #2e7d32;">0</strong></p>
            <p>Hatalı Okunan: <strong id="incorrectWords" style="color: #c62828;">0</strong></p>
            <h3>Başarı Oranı: <strong id="accuracy" style="color: #ff9f1c;">%0</strong></h3>
            <div id="incorrectWordsContainer" style="display: none;">
                <h4>Tekrar Etmen Gereken Kelimeler:</h4>
                <div id="incorrectWordsList"></div>
                <button id="retryIncorrectBtn"><i class="fas fa-star"></i> Yanlışları Tekrar Oku</button>
            </div>
        </div>
    </div>

    <script>
        const baslatBtn = document.getElementById('baslatBtn');
        const retryIncorrectBtn = document.getElementById('retryIncorrectBtn');
        const fileUploadArea = document.getElementById('file-upload-area');
        const fileInput = document.getElementById('file-input');
        const okumaAlani = document.getElementById('okuma-alani');
        const durum = document.getElementById('durum');
        const sonucModal = document.getElementById('sonucModal');
        const modalKapatBtn = document.getElementById('modalKapatBtn');
        const fontIncreaseBtn = document.getElementById('fontIncreaseBtn');
        const fontDecreaseBtn = document.getElementById('fontDecreaseBtn');
        const fontResetBtn = document.getElementById('fontResetBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const correctionBox = document.getElementById('correction-box');
        const retryWordBtn = document.getElementById('retry-word-btn');
        const skipWordBtn = document.getElementById('skip-word-btn');
        
        let isReading = false;
        let isPausedForCorrection = false;
        let orijinalKelimeler = [];
        let mevcutKelimeIndex = 0;
        let correctWordsCount = 0;
        let incorrectWordsCount = 0;
        let incorrectWordsList = [];
        let fullTextWords = [];
        const DEFAULT_FONT_SIZE = 26;
        const MIN_FONT_SIZE = 14;
        const MAX_FONT_SIZE = 48;
        const FONT_STEP = 2;
        let currentFontSize = DEFAULT_FONT_SIZE;
        
        function applyFontSize(size) { okumaAlani.style.fontSize = `${size}px`; }
        function updateProgressBar() { if (orijinalKelimeler.length === 0) return; const percentage = (mevcutKelimeIndex / orijinalKelimeler.length) * 100; progressBar.style.width = `${percentage}%`; }
        
        // YENİ: Kelimenin üstüne basıp seslendirme yaparken de kesme işaretlerini temizliyoruz
        function speakWord(wordText) { 
            const cleanText = wordText.replace(/[.,!?;:'"’‘]/g, ''); 
            const utterance = new SpeechSynthesisUtterance(cleanText); 
            utterance.lang = 'tr-TR'; 
            window.speechSynthesis.speak(utterance); 
        }
        
        function addWordClickListeners() { const wordSpans = okumaAlani.querySelectorAll('span[id^="kelime-"]'); wordSpans.forEach(span => { span.addEventListener('click', () => { speakWord(span.textContent); }); }); }
        
        function prepareReadingArea(words) {
            orijinalKelimeler = words;
            okumaAlani.innerHTML = orijinalKelimeler.map((kelime, index) => `<span id="kelime-${index}">${kelime}</span>`).join(' ');
            addWordClickListeners();
            mevcutKelimeIndex = 0;
            updateProgressBar();
            baslatBtn.disabled = false;
            baslatBtn.innerHTML = '<i class="fas fa-microphone"></i>Okumaya Başla';
            durum.textContent = "Metin okumaya hazır!";
        }

        fontIncreaseBtn.addEventListener('click', () => { if (currentFontSize < MAX_FONT_SIZE) { currentFontSize += FONT_STEP; applyFontSize(currentFontSize); } });
        fontDecreaseBtn.addEventListener('click', () => { if (currentFontSize > MIN_FONT_SIZE) { currentFontSize -= FONT_STEP; applyFontSize(currentFontSize); } });
        fontResetBtn.addEventListener('click', () => { currentFontSize = DEFAULT_FONT_SIZE; applyFontSize(currentFontSize); });
        
        async function handleFileUpload(file) {
            currentFontSize = DEFAULT_FONT_SIZE;
            applyFontSize(currentFontSize);
            progressContainer.style.display = 'block';
            mevcutKelimeIndex = 0;
            updateProgressBar();
            const formData = new FormData();
            formData.append('file', file);
            durum.innerHTML = '<div class="loader"></div>';
            baslatBtn.disabled = true;
            try {
                const response = await fetch('https://okumadunyasi-api.onrender.com/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Bir hata oluştu.');
                const metin = data.text;
                fullTextWords = metin.split(/\s+/).filter(kelime => kelime.trim() !== '');
                prepareReadingArea(fullTextWords);
                durum.innerHTML = `<strong>${file.name}</strong> yüklendi. Metin okumaya hazır!`;
            } catch (error) {
                durum.textContent = `Hata: ${error.message}`;
                progressContainer.style.display = 'none';
            }
        };

        fileUploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (event) => { const file = event.target.files[0]; if (file) { handleFileUpload(file); } });
        
        function showResults() {
            const totalWords = orijinalKelimeler.length; const analyzedWords = correctWordsCount + incorrectWordsCount; const accuracy = analyzedWords > 0 ? Math.round((correctWordsCount / analyzedWords) * 100) : 0; document.getElementById('totalWords').textContent = totalWords; document.getElementById('correctWords').textContent = correctWordsCount; document.getElementById('incorrectWords').textContent = incorrectWordsCount; document.getElementById('accuracy').textContent = `%${accuracy}`; const incorrectWordsContainer = document.getElementById('incorrectWordsContainer'); const incorrectWordsListElement = document.getElementById('incorrectWordsList'); if (incorrectWordsList.length > 0) { incorrectWordsContainer.style.display = 'block'; incorrectWordsListElement.textContent = incorrectWordsList.join(', '); } else { incorrectWordsContainer.style.display = 'none'; } sonucModal.classList.add('visible');
        }
        
        modalKapatBtn.addEventListener('click', () => { sonucModal.classList.remove('visible'); });
        
        retryIncorrectBtn.addEventListener('click', () => {
            sonucModal.classList.remove('visible');
            prepareReadingArea([...incorrectWordsList]);
        });
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            baslatBtn.addEventListener('click', () => {
                if (isReading) {
                    recognition.stop();
                } else {
                    correctWordsCount = 0;
                    incorrectWordsCount = 0;
                    incorrectWordsList = [];
                    okumaAlani.innerHTML = orijinalKelimeler.map((kelime, index) => `<span id="kelime-${index}">${kelime}</span>`).join(' ');
                    addWordClickListeners();
                    mevcutKelimeIndex = 0;
                    updateProgressBar();
                    recognition.start();
                }
            });

            skipWordBtn.addEventListener('click', () => {
                correctionBox.style.display = 'none';
                isPausedForCorrection = false;
                mevcutKelimeIndex++;
                updateProgressBar();
                recognition.start();
            });

            retryWordBtn.addEventListener('click', () => {
                const kelimeElementi = document.getElementById(`kelime-${mevcutKelimeIndex}`);
                kelimeElementi.className = '';
                if(incorrectWordsList.length > 0){ 
                    incorrectWordsCount--;
                    incorrectWordsList.pop();
                }
                correctionBox.style.display = 'none';
                isPausedForCorrection = false;
                recognition.start();
            });

            recognition.onstart = () => {
                isReading = true;
                durum.textContent = "Dinleniyor...";
                baslatBtn.innerHTML = '<i class="fas fa-stop-circle"></i>Okumayı Durdur';
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                durum.textContent = `Mikrofon Hatası: ${event.error}`;
            };

            recognition.onend = () => {
                if (isPausedForCorrection) { return; }
                isReading = false;
                durum.textContent = "Okuma bitti. Raporun hazırlanıyor...";
                baslatBtn.disabled = false;
                baslatBtn.innerHTML = '<i class="fas fa-microphone"></i>Tekrar Dene';
                showResults();
            };

            recognition.onresult = (event) => {
                const transkript = event.results[event.results.length - 1][0].transcript;
                
                // YENİ: Mikrofon verisini tamamen küçük harfe ('tr-TR' ile düzgünce) çeviriyoruz
                const okunanKelimeler = transkript.trim().toLocaleLowerCase('tr-TR').split(' ');
                
                let processedInLoop = false;
                okunanKelimeler.forEach(okunanKelime => {
                    if (processedInLoop || !okunanKelime || mevcutKelimeIndex >= orijinalKelimeler.length) return;

                    const kelimeElementi = document.getElementById(`kelime-${mevcutKelimeIndex}`);
                    const orijinalKelimeRaw = orijinalKelimeler[mevcutKelimeIndex];
                    
                    // YENİ: Kelime içindeki tırnak (') ve (’) işaretlerini de kaldırıyoruz
                    // Ayrıca toLocaleLowerCase('tr-TR') ekleyerek (I, i, ı) uyumunu tamamen sağlıyoruz
                    const orijinalKelimeClean = orijinalKelimeRaw.toLocaleLowerCase('tr-TR').replace(/[.,!?;:'"’‘]/g, '');
                    
                    if (okunanKelime === orijinalKelimeClean) {
                        kelimeElementi.className = 'correct';
                        correctWordsCount++;
                    } else {
                        if(!incorrectWordsList.includes(orijinalKelimeRaw)) {
                            incorrectWordsCount++;
                            incorrectWordsList.push(orijinalKelimeRaw);
                        }
                        kelimeElementi.className = 'incorrect';
                        
                        isPausedForCorrection = true;
                        recognition.stop();
                        
                        const currentCorrectionBox = document.getElementById('correction-box');
                        currentCorrectionBox.style.display = 'flex';
                        const wordRect = kelimeElementi.getBoundingClientRect();
                        currentCorrectionBox.style.top = `${wordRect.bottom + 5}px`;
                        currentCorrectionBox.style.left = `${wordRect.left}px`;
                        
                        processedInLoop = true;
                        return;
                    }
                    mevcutKelimeIndex++;
                    updateProgressBar();
                });
            };
        }
    </script>
</body>
</html>
